name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6bc82e05fd0ea64601dd4b465378bbcf57de0314 # v4.32.1
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete history for committed secrets
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE: "gitleaks_8.30.1_linux_x64.tar.gz"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          install -d "${tool_dir}"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "${tool_dir}/${GITLEAKS_ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${tool_dir}/${GITLEAKS_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${tool_dir}/${GITLEAKS_ARCHIVE}" -C "${tool_dir}" gitleaks
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree)" = "true"
          "${tool_dir}/gitleaks" git "$GITHUB_WORKSPACE" --redact --no-banner
